<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080b14">
<title>Sandfall</title>
<style>
:root{
  --bg:#080b14; --glass:rgba(12,16,30,.52); --glass2:rgba(12,16,30,.38);
  --tile:rgba(255,255,255,.07); --tile-h:rgba(255,255,255,.14);
  --line:rgba(255,255,255,.14); --text:#eef1f8; --dim:#a3abc2; --accent:#7cc8ff; --accent2:#ffb057;
  /* screen insets (camera cutout, rounded corners); MainActivity overrides these */
  --it:env(safe-area-inset-top,0px); --ir:env(safe-area-inset-right,0px);
  --ib:env(safe-area-inset-bottom,0px); --il:env(safe-area-inset-left,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font:13px/1.3 system-ui,Roboto,"Segoe UI",sans-serif;user-select:none;-webkit-user-select:none;overscroll-behavior:none;touch-action:none}
canvas#c{position:absolute;left:0;top:0;display:block;touch-action:none}
button{font:inherit;color:inherit}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px) saturate(1.3);-webkit-backdrop-filter:blur(10px) saturate(1.3);
  box-shadow:0 8px 28px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08)}

/* --- top overlay: play / step / speed --- */
#top{position:absolute;top:calc(var(--it) + 10px);left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:5}
.fab{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;cursor:pointer;padding:0;
  background:var(--glass2);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 4px 16px rgba(0,0,0,.35);transition:transform .1s,background .15s;font-weight:700;font-size:14px}
.fab:active{transform:scale(.9)}
.fab svg{width:20px;height:20px;fill:currentColor}
.fab:disabled{opacity:.35}
#play.paused{background:rgba(255,176,87,.35);border-color:rgba(255,190,120,.6)}

/* --- challenge goal --- */
#goal{position:absolute;top:calc(var(--it) + 66px);left:50%;transform:translateX(-50%);width:min(380px,calc(100% - 24px));display:none;
  border-radius:14px;padding:8px 12px;z-index:4}
#goal .t{font-weight:700;font-size:14px}
#goal .d{color:var(--dim);font-size:12px;margin-top:2px}
#goal .gr{display:flex;align-items:center;gap:10px;margin-top:6px}
#bar{flex:1;height:7px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden}
#bar div{height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,#5fe0a0,#b6f36b);transition:width .25s}
#goal.min .d{display:none}
#goal{transition:opacity .16s}
body.menuopen #goal{opacity:0;pointer-events:none}   /* keep the goal card from showing through an open menu */

/* --- corner buttons --- */
.corner{position:absolute;bottom:calc(var(--ib) + 18px);width:62px;height:62px;border-radius:50%;z-index:6;cursor:pointer;padding:0;
  display:grid;place-items:center;touch-action:none;transition:scale .15s,box-shadow .15s;animation:bob 4.2s ease-in-out infinite}
#elBtn{left:calc(var(--il) + 18px)}
#optBtn{right:calc(var(--ir) + 18px);animation-delay:-2.1s}
/* floating bubbles: they bob gently, can be dragged anywhere and drift to the nearest side */
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -4px}}
.corner.held{scale:.94}
.corner.dragging{scale:1.12;animation:none;box-shadow:0 14px 34px rgba(0,0,0,.5),0 0 0 2px rgba(124,200,255,.35)}
.corner.drift{transition:left .45s cubic-bezier(.2,1.5,.4,1),top .45s cubic-bezier(.2,1.5,.4,1),scale .15s}
#elBtn .sw{width:38px;height:38px}
#elBtn .bud{position:absolute;top:-4px;right:-4px;min-width:22px;padding:2px 5px;border-radius:11px;background:var(--accent2);color:#1a1206;font-size:11px;font-weight:800;display:none}
#elBtn .bud.show{display:block}
#optBtn svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2}
.b svg.ic{width:18px;height:18px;vertical-align:-4px;margin-right:4px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.b svg.ic.solo{margin-right:0;width:20px;height:20px}
.corner.open{border-color:var(--accent);box-shadow:0 0 0 2px rgba(124,200,255,.35),0 8px 28px rgba(0,0,0,.35)}

/* --- menus --- */
.menu{position:absolute;bottom:calc(var(--ib) + 92px);z-index:7;border-radius:20px;padding:12px;
  max-height:calc(100% - var(--it) - var(--ib) - 170px);overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;
  opacity:0;pointer-events:none;transform:var(--tf,translate(0,0)) scale(.85);transition:opacity .16s,transform .16s;transform-origin:var(--ox,0) var(--oy,100%)}
.menu.open{opacity:1;pointer-events:auto;transform:var(--tf,none)}
#elMenu{left:calc(var(--il) + 12px);width:min(318px,calc(100% - 24px))}
#optMenu{right:calc(var(--ir) + 12px);width:min(268px,calc(100% - 24px));display:flex;flex-direction:column;gap:9px}
#optMenu.open{display:flex}
.cat{font-size:10px;text-transform:uppercase;letter-spacing:1.4px;color:var(--dim);margin:2px 2px 7px}
.cat:not(:first-child){margin-top:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}

/* --- phone held sideways: the app stays portrait, but the interface turns to stay upright --- */
:root{--r:0deg}
.fab,#elBtn .sw,#optBtn svg,#overlay .card{rotate:var(--r);transition:rotate .3s}
body.land #top{left:auto;top:50%;transform:translateY(-50%);flex-direction:column}
body.land[data-rot="90"] #top{right:calc(var(--ir) + 10px)}
body.land[data-rot="-90"] #top{left:calc(var(--il) + 10px);flex-direction:column-reverse}
body.land #toast{top:50%;bottom:auto;transform:translate(-50%,-50%) rotate(var(--r));max-width:min(420px,calc(100vh - 60px))}
body.land .grid4{grid-template-columns:repeat(8,1fr)}
body.land #optMenu.open{display:block;column-count:3;column-gap:14px}
body.land #optMenu > *,body.land #sandboxOnly > *,body.land #challengeOnly > *{break-inside:avoid;margin-bottom:9px}
body.land #sandboxOnly:not(.hidden),body.land #challengeOnly:not(.hidden){display:block!important}
body.land #optMenu .lbl{margin-top:4px}
.brushRows .row + .row{margin-top:6px}
.sl{display:flex;flex-direction:column;gap:9px}
body.land .brushRows{display:flex;gap:6px}
body.land .brushRows .row{flex:1;margin-top:0!important}
body.land #optMenu .sl{break-inside:avoid;margin-bottom:9px}
body.land #optMenu > button.b,body.land #sandboxOnly > button.b,body.land #challengeOnly > button.b,body.land #optMenu select.b{display:block;width:100%}
body.land #optMenu > .mclose{display:grid;width:30px}
/* sideways options: fixed column starts, and the item that starts the last column leaves room for the x */
body.land #worldLbl{break-before:column}
body.land #steamPctBox{break-before:column;margin-right:40px}
body.land #challengeOnly:not(.hidden){break-before:column}
body.land #optMenu:has(#sandboxOnly.hidden) #exitBtn{break-before:column;width:calc(100% - 40px)}
body.land #elMenu .cat:not(:first-child){margin-top:8px}
body.land #elMenu .el{padding:6px 0 4px}
body.land #elMenu .sw{width:28px;height:28px}
.el{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 6px;border-radius:14px;
  background:var(--tile);border:1px solid transparent;font-size:11px;cursor:pointer}
.el:active{transform:scale(.94)}
.el.on{border-color:var(--accent);background:rgba(124,200,255,.18);box-shadow:0 0 14px rgba(124,200,255,.3)}
.sw{display:block;width:32px;height:32px;border-radius:50%;box-shadow:inset 0 -3px 6px rgba(0,0,0,.35), inset 0 2px 3px rgba(255,255,255,.35), 0 2px 6px rgba(0,0,0,.4)}
.el .bud{position:absolute;top:3px;right:5px;font-size:10px;color:var(--accent2);font-weight:800}
.el.disabled{opacity:.2;pointer-events:none}
.b{background:var(--tile);border:1px solid var(--line);border-radius:12px;padding:10px 6px;cursor:pointer;min-height:42px}
.b:active{background:var(--tile-h)}
.b.on{background:rgba(124,200,255,.22);border-color:var(--accent)}
select.b{width:100%;appearance:none;-webkit-appearance:none;padding:10px 28px 10px 12px;color:var(--text);
  background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat;background-color:var(--tile)}
select.b option{background:#161b2c}
.row{display:flex;gap:6px;align-items:center}
.row>*{flex:1}
.lbl{font-size:10px;text-transform:uppercase;letter-spacing:1.3px;color:var(--dim);margin:3px 2px -3px}
.sub{font-size:11px;color:var(--dim);margin:-3px 2px 0}
#gravDial{flex:none;width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#28304d,#141a2c);
  border:1px solid var(--line);display:grid;place-items:center;font-size:19px}
#gravDial span{display:block;transition:transform .2s;color:var(--accent2)}
.sizeRow{margin-top:8px}
.slab{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:2px 2px -6px;font-size:12px}
.slab b{font-weight:600;color:var(--accent2);font-size:12px;white-space:nowrap}
.sizeRow input{flex:1 1 auto}
#sizeDot{flex:none;width:26px;height:26px;display:grid;place-items:center}
#sizeDot i{display:block;border-radius:50%;background:var(--text)}
input[type=range]{width:100%;accent-color:var(--accent);height:30px}
/* little x to close a menu */
.mclose{position:absolute;top:7px;right:7px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.08);
  display:grid;place-items:center;padding:0;cursor:pointer;z-index:1}
.mclose:active{background:var(--tile-h)}
.mclose svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
#elMenu #palette .cat:first-child{margin-bottom:12px}
#mode{width:calc(100% - 40px)!important}
/* sideways, the game drags the sliders itself (Android's own dragging ignores the turn) */
body.land .menu input[type=range]{pointer-events:none}
body.land .sl,body.land .sizeRow{touch-action:none}

#toast{position:absolute;bottom:calc(var(--ib) + 96px);left:50%;transform:translateX(-50%);background:rgba(12,15,28,.85);border:1px solid var(--line);
  border-radius:20px;padding:7px 14px;font-size:12px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:calc(100% - 170px);text-align:center;z-index:8}
#toast.show{opacity:1}
#overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,7,14,.45);z-index:9}
#overlay .card{border-radius:20px;padding:22px 26px;text-align:center;width:min(320px,calc(100% - 40px))}
#overlay h2{margin:0 0 6px;font-size:24px}
#overlay p{margin:0 0 16px;color:var(--dim)}
.hidden{display:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="top">
  <button class="fab" id="play" aria-label="Pause"></button>
  <button class="fab" id="step" aria-label="One step"><svg viewBox="0 0 24 24"><path d="M5 5l10 7-10 7z"/><rect x="16" y="5" width="3" height="14" rx="1"/></svg></button>
  <button class="fab" id="speed" aria-label="Speed">1×</button>
  <button class="fab" id="undo" aria-label="Undo" disabled><svg viewBox="0 0 24 24"><path d="M9 7L4.5 11.5 9 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 11.5h9a5 5 0 0 1 0 10h-3" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
</div>

<div id="goal" class="glass">
  <div class="t" id="goalTitle"></div>
  <div class="d" id="goalDesc"></div>
  <div class="gr"><span id="goalText"></span><div id="bar"><div></div></div><span id="timer"></span></div>
</div>

<button class="corner glass" id="elBtn" aria-label="Elements"><span class="sw"></span><span class="bud"></span></button>
<button class="corner glass" id="optBtn" aria-label="Options">
  <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>
</button>

<div id="elMenu" class="menu glass">
  <button class="mclose" aria-label="Close menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <div id="palette"></div>
  <div class="cat">Brush</div>
  <div class="brushRows">
    <div class="row">
      <button class="b on" data-shape="brush">✎ Draw</button>
      <button class="b" data-shape="line">╱ Line</button>
    </div>
    <div class="row">
      <button class="b" data-shape="rect">▢ Box</button>
      <button class="b" data-shape="frect">■ Fill</button>
    </div>
  </div>
  <div class="row sizeRow"><span id="sizeDot"><i></i></span><input id="size" type="range" min="0" max="12" value="4" aria-label="Brush size"></div>
</div>

<div id="optMenu" class="menu glass">
  <button class="mclose" aria-label="Close menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <select id="mode" class="b" aria-label="Mode"></select>
  <div class="lbl">Gravity</div>
  <div class="row"><button class="b" id="tiltL" aria-label="Tilt left"><svg class="ic solo" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4.5v5h5"/><path d="M5.2 14.5a7.5 7.5 0 1 0 1.6-7.9L4 9.5"/></svg></button><div id="gravDial"><span>↓</span></div><button class="b" id="tiltR" aria-label="Tilt right"><svg class="ic solo" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4.5v5h-5"/><path d="M18.8 14.5a7.5 7.5 0 1 1-1.6-7.9L20 9.5"/></svg></button></div>
  <button class="b hidden" id="tiltPhone">📱 Tilt phone: off</button>
  <div id="sandboxOnly" style="display:flex;flex-direction:column;gap:9px">
    <div class="lbl">Screen edges</div>
    <div class="row"><button class="b on" id="edgeWall"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="8.5" y="8.5" width="7" height="7" rx="1" fill="currentColor" stroke="none"/></svg>Solid</button><button class="b" id="edgeOpen"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2" stroke-dasharray="3.2 2.6"/></svg>Open</button></div>
    <div class="sub" id="edgeHint">Things pile up against the edges.</div>
    <div class="lbl" id="worldLbl">World</div>
    <div class="row"><button class="b" id="save">Save</button><button class="b" id="load">Load</button><button class="b" id="clear">Clear</button></div>
    <div class="lbl">Nature</div>
    <div class="sl">
      <div class="slab"><span>Virus eats plants</span><b id="virusVal"></b></div>
      <input id="virusEat" type="range" min="0" max="10" step="1" aria-label="How fast virus eats plants">
    </div>
    <div class="sl">
      <div class="slab"><span>Steam turns to water</span><b id="steamVal"></b></div>
      <input id="steamTime" type="range" min="0" max="9" step="1" aria-label="How long until steam turns to water">
    </div>
    <div class="sl" id="steamPctBox">
      <div class="slab"><span>Steam that becomes water</span><b id="steamPctVal"></b></div>
      <input id="steamPct" type="range" min="0" max="100" step="10" aria-label="Percentage of steam that turns back into water">
    </div>
    <select id="rule" class="b" aria-label="How virus grows">
      <option value="B3/S23">Virus: Classic</option>
      <option value="B36/S23">Virus: HighLife</option>
      <option value="B3678/S34678">Virus: Day &amp; Night</option>
      <option value="B3/S12345">Virus: Maze</option>
      <option value="B2/S">Virus: Seeds</option>
      <option value="B368/S245">Virus: Morley</option>
    </select>
  </div>
  <div id="challengeOnly" class="hidden" style="display:flex;flex-direction:column;gap:9px">
    <button class="b" id="reset">↺ Reset level</button>
    <div class="sub">Tap the goal card to show or hide the hint.</div>
  </div>
  <button class="b" id="exitBtn"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5v8"/><path d="M6.6 7.2a7.6 7.6 0 1 0 10.8 0"/></svg>Exit</button>
  <div class="sub">Your sandbox is saved automatically. Drag the round buttons to move them.</div>
</div>

<div id="toast"></div>
<div id="overlay"><div class="card glass"><h2 id="ovTitle"></h2><p id="ovText"></p>
  <div class="row"><button class="b" id="ovRetry">Try again</button><button class="b on" id="ovNext">Next ›</button></div></div></div>

<script>
"use strict";
// =====================================================================
//  Simulation
// =====================================================================
// The grid is 180 cells wide and as tall as the screen's shape needs, so the play area fills the whole phone.
const VW0 = innerWidth || screen.width, VH0 = innerHeight || screen.height;
const W = 180, H = Math.max(200, Math.min(520, Math.ceil(W * VH0 / VW0))), N = W * H;
const E=0,WALL=1,SAND=2,WATER=3,OIL=4,FIRE=5,PLANT=6,SEED=7,SALT=8,SOIL=9,VIRUS=10,CLOUD=11,MAGMA=12,SHAKER=13,SPILL=14,TOXIN=15,BRINE=16,STEAM=17,SEEDER=18,ACID=19,VAT=20;
const INFO = [
  ["Eraser","Removes anything.","radial-gradient(circle at 35% 30%,#3a4058,#141826)"],
  ["Wall","Blocks everything.","repeating-linear-gradient(0deg,#5c6276 0 5px,#3f4456 5px 6px)"],
  ["Sand","Falls and piles up.","radial-gradient(circle at 35% 30%,#ffe7a8,#d9b06a 60%,#a5803f)"],
  ["Water","Flows. Boils into steam on fire, dissolves salt into brine.","radial-gradient(circle at 35% 30%,#a8dcff,#2f86e6 55%,#174a9c)"],
  ["Oil","Floats on water. Very flammable.","radial-gradient(circle at 35% 30%,#c49052,#5a3416 60%,#2a170a)"],
  ["Fire","Rises and burns out. Burns plants, oil, virus.","radial-gradient(circle at 50% 70%,#fff3a0,#ff9a2a 45%,#c2300c)"],
  ["Plant","Drinks water and grows. Brine withers it.","radial-gradient(circle at 35% 30%,#b8f58a,#36b552 55%,#16692c)"],
  ["Seed","Sprouts when wet.","radial-gradient(circle at 35% 30%,#e8c08a,#a6743e 60%,#5f3e1c)"],
  ["Salt","Dissolves in water into brine. Kills virus. Burns yellow. Melts on magma.","radial-gradient(circle at 35% 30%,#ffffff,#dfe3ee 55%,#9aa1b5)"],
  ["Soil","Ground. Water erodes it to sand.","radial-gradient(circle at 35% 30%,#a07650,#6a4528 60%,#3a2414)"],
  ["Virus","Lives by Conway's Life. Eats plants.","radial-gradient(circle at 35% 30%,#ffb0ff,#d040d8 55%,#6a1680)"],
  ["Cloud","Rains water.","radial-gradient(circle at 35% 30%,#ffffff,#cfe0ff 55%,#8aa4d6)"],
  ["Magma","Spews fire. Burns what touches it, boils water, melts salt.","radial-gradient(circle at 40% 40%,#ffd060,#ff5a1a 45%,#7a1606)"],
  ["Shaker","Sprinkles salt.","radial-gradient(circle at 35% 30%,#f2f4fa,#a8aec2 55%,#5e6478)"],
  ["Spill","Leaks oil.","radial-gradient(circle at 35% 30%,#d8a060,#7a4a1c 55%,#3a200a)"],
  ["Toxin","Breeds virus.","radial-gradient(circle at 35% 30%,#f2a6ff,#a426c8 50%,#3e0a52)"],
  ["Brine","Salty water. Sinks under water, withers plants, kills virus. Boils into salt.","radial-gradient(circle at 35% 30%,#bff3e4,#3f9e98 55%,#1b4d5c)"],
  ["Steam","Floats up, then may rain back down as water. Plants it touches may grow into it.","radial-gradient(circle at 35% 30%,#ffffff,#dde3ee 50%,rgba(150,162,184,.7))"],
  ["Seeder","Grows plants when water touches it.","radial-gradient(circle at 35% 30%,#c8f29a,#6aa83a 45%,#5a3a1a 75%)"],
  ["Acid","Dissolves salt into nothing. Eats sand, soil and plants. Water dilutes it.","radial-gradient(circle at 35% 30%,#f4ffb0,#a8e030 50%,#4a7a08)"],
  ["Vat","Drips acid.","radial-gradient(circle at 35% 30%,#d8ff70,#5a6a3a 50%,#23281c)"],
];
const GRAIN = new Uint8Array(32); [SAND,WATER,OIL,SEED,SALT,BRINE,STEAM,ACID].forEach(t=>GRAIN[t]=1);
const DENS = new Float32Array(32); DENS[OIL]=1; DENS[WATER]=2; DENS[ACID]=2.2; DENS[BRINE]=2.5; DENS[SAND]=3; DENS[SALT]=3; DENS[SEED]=3;
const FLAMMABLE = new Float32Array(32); FLAMMABLE[PLANT]=0.2; FLAMMABLE[OIL]=0.45; FLAMMABLE[SEED]=0.3; FLAMMABLE[VIRUS]=0.5;

const type = new Uint8Array(N), shade = new Uint8Array(N), life = new Uint8Array(N);
const stamp = new Uint16Array(N), lock = new Uint8Array(N), nb = new Uint8Array(N), depth = new Uint8Array(N);
let tk = 1;
const DX = [0,-1,-1,-1,0,1,1,1], DY = [1,1,0,-1,-1,-1,0,1];   // index 0 = down
let grav = 0;
let openEdges = false;   // the player's choice (sandbox)
let edgesOpen = false;   // what the simulation uses right now (challenges always have solid edges)
let virusP = .5;         // chance per tick that virus eats a plant it touches
let steamDec = 1.76;     // steam "heat" lost per tick (bigger = turns to water sooner)
let steamWater = .6;     // chance a cooled steam cell becomes water (otherwise it vanishes)
const ORTH = [[1,0],[-1,0],[0,1],[0,-1]];
const OUT = -2;          // a move that carried the cell off the screen
const rnd = Math.random;

function set(i, t){
  type[i] = t; shade[i] = (rnd()*16)|0;
  life[i] = t===FIRE ? 10 + ((rnd()*26)|0) : t===STEAM ? 100 + ((rnd()*100)|0) : 0;
  stamp[i] = tk;
}
function vanish(i){ type[i]=E; life[i]=0; }
function swap(i, j){
  let t=type[i]; type[i]=type[j]; type[j]=t;
  t=shade[i]; shade[i]=shade[j]; shade[j]=t;
  t=life[i]; life[i]=life[j]; life[j]=t;
  stamp[i]=stamp[j]=tk;
}
function idx(x,y){ return (x<0||y<0||x>=W||y>=H) ? -1 : y*W+x; }
function canDisplace(s, o){
  if (o===E) return true;
  if (o===FIRE || o===STEAM) return DENS[s] > 0;
  if (o===WATER || o===OIL || o===BRINE || o===ACID) {
    if (!(DENS[s] > DENS[o])) return false;
    return rnd() < (s===SALT && o===OIL ? 0.08 : 0.5);
  }
  return false;
}
// Move cell i one step in direction k. Returns the new index, OUT if it left the screen, or -1.
function tryDir(i,x,y,k){
  const j = idx(x+DX[k&7], y+DY[k&7]);
  if (j<0){ if (edgesOpen){ vanish(i); return OUT; } return -1; }
  if (canDisplace(type[i], type[j])) { swap(i,j); return j; }
  return -1;
}
function tryEmpty(i,x,y,k){
  const j = idx(x+DX[k&7], y+DY[k&7]);
  if (j<0){ if (edgesOpen){ vanish(i); return OUT; } return -1; }
  if (type[j]!==E) return -1;
  swap(i,j); return j;
}
function powder(i,x,y){
  if (tryDir(i,x,y,grav)!==-1) return;
  const s = rnd()<.5 ? 1 : -1;
  if (tryDir(i,x,y,grav+s+8)!==-1) return;
  tryDir(i,x,y,grav-s+8);
}
function liquid(i,x,y){
  if (tryDir(i,x,y,grav)!==-1) return;
  const s = rnd()<.5 ? 1 : -1;
  if (tryDir(i,x,y,grav+s+8)!==-1) return;
  if (tryDir(i,x,y,grav-s+8)!==-1) return;
  for (const side of [s, -s]) {
    const k = (grav + 2*side + 8) & 7;
    let cx=x, cy=y, ci=i, moved=false;
    for (let n=0; n<4; n++) {
      const j = idx(cx+DX[k], cy+DY[k]);
      if (j<0){ if (edgesOpen){ vanish(ci); moved=true; } break; }
      const o = type[j];
      if (o===E || (o!==type[ci] && (o===WATER||o===OIL||o===BRINE||o===ACID) && DENS[type[ci]]>DENS[o] && rnd()<.5)) {
        swap(ci,j); ci=j; cx+=DX[k]; cy+=DY[k]; moved=true;
        const d = idx(cx+DX[grav], cy+DY[grav]);
        if (d>=0 && type[d]===E) break;
      } else break;
    }
    if (moved) return;
  }
}
function emit(i,x,y,t,p,k){
  if (rnd() >= p) return;
  const j = idx(x+DX[k&7], y+DY[k&7]);
  if (j>=0 && type[j]===E) set(j,t);
}

// Steam drifts upward, bubbling up through liquids.
// Returns true if the steam moved (or left the screen).
function gas(i,x,y,k){
  const j = idx(x+DX[k&7], y+DY[k&7]);
  if (j<0){ if (edgesOpen){ vanish(i); return true; } return false; }
  const o = type[j];
  if (o===E || ((o===WATER||o===OIL||o===BRINE||o===ACID) && rnd()<.5)){ swap(i,j); return true; }
  return false;
}
// Steam spreads like a gas: it rises, but also drifts sideways up to 3 cells at a time,
// sliding along ceilings (water flowing on a floor, upside down) so it fills spaces.
function steamMove(i,x,y,up){
  const s = rnd()<.5 ? 1 : -1, r = rnd();
  if (r<.45 && gas(i,x,y,up)) return;
  if (r<.75 && (gas(i,x,y,up+s) || gas(i,x,y,up-s+8))) return;
  for (const side of [s,-s]){
    const k = (grav + 2*side + 8) & 7;
    let ci=i, cx=x, cy=y, moved=false;
    for (let n=0; n<3; n++){
      const nx=cx+DX[k], ny=cy+DY[k], j=idx(nx,ny);
      if (j<0){ if (edgesOpen){ vanish(ci); moved=true; } break; }
      if (type[j]!==E) break;
      swap(ci,j); ci=j; cx=nx; cy=ny; moved=true;
      const a=idx(cx+DX[up], cy+DY[up]);
      if (a>=0 && type[a]===E && rnd()<.5) break;                    // open air above: may rise again next frame
    }
    if (moved) return;
  }
}
// A fire that touches salt burns yellow (sodium flame).
function yellow(j){ shade[j] |= 16; if (life[j]<30) life[j]+=8; }

function stepWorld(){
  tk = ((tk + 1) & 0xffff) || 1;
  const gx = DX[grav], gy = DY[grav], up = (grav+4)&7;
  const y0 = gy>0 ? H-1 : 0, y1 = gy>0 ? -1 : H, ys = gy>0 ? -1 : 1;
  for (let y=y0; y!==y1; y+=ys) {
    const xs = gx>0 ? -1 : gx<0 ? 1 : (rnd()<.5 ? 1 : -1);
    const x0 = xs<0 ? W-1 : 0, x1 = xs<0 ? -1 : W;
    for (let x=x0; x!==x1; x+=xs) {
      const i = y*W+x, t = type[i];
      if (t===E || t===WALL || stamp[i]===tk) continue;
      switch (t) {
        case SAND: powder(i,x,y); break;
        case SEED: {
          let wet=false;
          for (const [dx,dy] of ORTH){ const j=idx(x+dx,y+dy); if(j>=0&&type[j]===WATER){wet=true;break;} }
          if (wet) { set(i,PLANT); break; }
          powder(i,x,y); break;
        }
        case SALT: {
          let gone=false;
          for (const [dx,dy] of ORTH){
            const j=idx(x+dx,y+dy); if(j<0) continue;
            const o=type[j];
            if (o===VIRUS) set(j,E);
            else if (o===FIRE) yellow(j);
            else if (o===WATER && rnd()<.012){ set(j,BRINE); set(i,E); gone=true; break; }   // dissolves
          }
          if (!gone) powder(i,x,y);
          break;
        }
        case WATER: {
          for (const [dx,dy] of ORTH){
            const j=idx(x+dx,y+dy); if(j<0) continue;
            const o=type[j];
            if (o===FIRE){ if (rnd()<.5) set(j,E); set(i,STEAM); break; }   // boils, and may put the fire out
            else if (o===SOIL && rnd()<.004) set(j,SAND);
          }
          if (type[i]===WATER) liquid(i,x,y);
          break;
        }
        case ACID: {
          let used=false;
          for (const [dx,dy] of ORTH){
            const j=idx(x+dx,y+dy); if(j<0) continue;
            const o=type[j];
            let ate=false;
            if (o===SALT) ate=true;                                        // salt dissolves into nothing
            else if (o===BRINE && rnd()<.2){ set(j,WATER); if (rnd()<.5){ set(i,E); used=true; break; } continue; }   // takes the salt out
            else if ((o===SAND||o===SOIL||o===PLANT||o===SEED||o===VIRUS) && rnd()<.02) ate=true;
            else if (o===WATER && rnd()<.001){ set(i,WATER); used=true; break; }   // diluted
            if (ate){ set(j,E); if (rnd()<.5){ set(i,E); used=true; break; } }    // each bite may use the acid up
          }
          if (!used) liquid(i,x,y);
          break;
        }
        case BRINE: {
          let boiled=false;
          for (const [dx,dy] of ORTH){
            const j=idx(x+dx,y+dy); if(j<0) continue;
            const o=type[j];
            if (o===FIRE){ yellow(j); emit(i,x,y,STEAM,.6,up); set(i,SALT); boiled=true; break; }   // boils away, leaves salt
            else if (o===VIRUS && rnd()<.3) set(j,E);
            else if (o===PLANT && rnd()<.01) set(j,E);                    // withers plants
          }
          if (!boiled && rnd()<.04){                                     // magma heats it through a salt crust
            for (let n=1;n<=12;n++){
              const j=idx(x+DX[grav]*n,y+DY[grav]*n); if(j<0) break;
              const o=type[j];
              if (o===MAGMA){ emit(i,x,y,STEAM,.6,up); set(i,SALT); boiled=true; break; }
              if (o!==SALT && o!==BRINE) break;
            }
          }
          if (!boiled) liquid(i,x,y);
          break;
        }
        case STEAM: {
          const dec = (steamDec|0) + (rnd() < steamDec%1 ? 1 : 0);
          if (life[i]<=dec){ set(i, rnd()<steamWater ? WATER : E); break; }   // condenses into rain (or just fades)
          life[i]-=dec;
          let grew=false;
          for (const [dx,dy] of ORTH){                                   // plants can drink the steam and grow into it
            const j=idx(x+dx,y+dy);
            if (j>=0 && type[j]===PLANT && rnd()<.1){ set(i,PLANT); grew=true; break; }
          }
          if (grew) break;
          steamMove(i,x,y,up);
          break;
        }
        case VIRUS: {
          for (let k=0;k<8;k++){ const j=idx(x+DX[k],y+DY[k]); if (j>=0 && type[j]===PLANT && rnd()<virusP) set(j,VIRUS); }
          break;
        }
        case OIL: liquid(i,x,y); break;
        case FIRE: {
          if (life[i]<=1){ set(i,E); break; }
          life[i]--;
          let fuel=false;
          for (const [dx,dy] of ORTH){
            const j=idx(x+dx,y+dy); if(j<0) continue;
            const f=FLAMMABLE[type[j]];
            if (f){ fuel=true; if (rnd()<f){ const was=type[j]; set(j,FIRE); if(was===OIL) life[j]+=12; } }
            else if (type[j]===SALT || type[j]===BRINE) shade[i] |= 16;
          }
          if (fuel && rnd()<.7) break;      // flames cling to whatever they're burning
          const r=rnd();
          const k = r<.5 ? up : r<.7 ? up+1 : r<.9 ? up+7 : (r<.95 ? up+2 : up+6);
          tryEmpty(i,x,y,k);
          break;
        }
        case PLANT: {
          if (rnd()<.15) for (const [dx,dy] of ORTH){
            const j=idx(x+dx,y+dy);
            if (j>=0 && type[j]===WATER && rnd()<.25){ set(j,PLANT); break; }
          }
          break;
        }
        case CLOUD:  emit(i,x,y,WATER,.06,grav); break;
        case SHAKER: emit(i,x,y,SALT,.05,grav); break;
        case VAT:    emit(i,x,y,ACID,.05,grav); break;
        case SEEDER: {                                                   // grows plants into water that touches it
          for (const [dx,dy] of ORTH){
            const j=idx(x+dx,y+dy);
            if (j>=0 && type[j]===WATER && rnd()<.3) set(j,PLANT);
          }
          break;
        }
        case SPILL:  emit(i,x,y,OIL,.06,grav); break;
        case MAGMA: {
          for (const [dx,dy] of ORTH){
            const j=idx(x+dx,y+dy); if(j<0) continue;
            const o=type[j];
            if (FLAMMABLE[o]) set(j,FIRE);                                // anything that burns catches at once
            else if (o===WATER && rnd()<.3) set(j,STEAM);
            else if (o===BRINE && rnd()<.3){ set(j,SALT); emit(i,x,y,STEAM,.5,up); }
            else if (o===SALT && rnd()<.2) set(j,E);                      // melts away
          }
          emit(i,x,y,FIRE,.35,(rnd()*8)|0);
          break;
        }
        case TOXIN:  {
          if (rnd()<.04){ const k=(rnd()*8)|0; const j=idx(x+DX[k],y+DY[k]); if(j>=0&&(type[j]===E||type[j]===WATER)) set(j,VIRUS); }
          break;
        }
      }
    }
  }
  if (tk % 5 === 0) lifeStep();
}

let BIRTH = new Uint8Array(9), SURV = new Uint8Array(9);
function setRule(s){
  BIRTH = new Uint8Array(9); SURV = new Uint8Array(9);
  const m = /B(\d*)\/S(\d*)/.exec(s); if (!m) return;
  for (const c of m[1]) BIRTH[+c]=1;
  for (const c of m[2]) SURV[+c]=1;
}
setRule("B3/S23");
function lifeStep(){
  nb.fill(0);
  for (let y=0;y<H;y++) for (let x=0;x<W;x++){
    const t = type[y*W+x];
    if (t!==VIRUS && t!==TOXIN) continue;
    for (let k=0;k<8;k++){ const j=idx(x+DX[k],y+DY[k]); if(j>=0) nb[j]++; }
  }
  for (let i=0;i<N;i++){
    const t=type[i], n=nb[i];
    if (t===VIRUS){ if(!SURV[n]) set(i,E); }
    else if ((t===E||t===WATER) && BIRTH[n]) set(i,VIRUS);
  }
}

// =====================================================================
//  Rendering
// =====================================================================
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const simC = document.createElement("canvas"); simC.width=W; simC.height=H;
const simX = simC.getContext("2d");
const simImg = simX.createImageData(W,H), P = simImg.data;
const glowC = document.createElement("canvas"); glowC.width=W; glowC.height=H;
const glowX = glowC.getContext("2d");
const glowImg = glowX.createImageData(W,H), G = glowImg.data;
const blurC = document.createElement("canvas"); blurC.width=W; blurC.height=H;
const blurX = blurC.getContext("2d");
const haloC = document.createElement("canvas"); haloC.width=W>>1; haloC.height=H>>1;
const haloX = haloC.getContext("2d");
const shadC = document.createElement("canvas"); shadC.width=W; shadC.height=H;
const shadX = shadC.getContext("2d");
let bgC = null, vigC = null;
const SIN = new Float32Array(256); for (let i=0;i<256;i++) SIN[i]=Math.sin(i/256*Math.PI*2);
const HASH = new Uint8Array(N); for (let i=0;i<N;i++){ let h=(i*2654435761)>>>0; h^=h>>>15; h=Math.imul(h,0x2c1b3c6d)>>>0; HASH[i]=(h>>>8)&255; }

function buildBackdrop(w,h){
  bgC = document.createElement("canvas"); bgC.width=w; bgC.height=h;
  const b = bgC.getContext("2d");
  const g = b.createLinearGradient(0,0,0,h);
  g.addColorStop(0,"#1a2350"); g.addColorStop(.35,"#121838"); g.addColorStop(.75,"#0b0f22"); g.addColorStop(1,"#080a14");
  b.fillStyle=g; b.fillRect(0,0,w,h);
  const r2 = b.createRadialGradient(w,h,0,w,h,w*1.1);
  r2.addColorStop(0,"rgba(60,26,90,.45)"); r2.addColorStop(1,"rgba(60,26,90,0)");
  b.fillStyle=r2; b.fillRect(0,0,w,h);
  // faint stars
  const dot = Math.max(1.2, w/500);
  for (let n=0;n<Math.floor(w*h/9000);n++){
    const x=Math.random()*w, y=Math.random()*h*0.7, a=Math.random()*.3+.05;
    b.fillStyle=`rgba(180,200,255,${a})`; b.fillRect(x,y,dot,dot);
  }
  vigC = document.createElement("canvas"); vigC.width=w; vigC.height=h;
  const v = vigC.getContext("2d");
  const r = v.createRadialGradient(w/2,h*.45,Math.min(w,h)*.45,w/2,h/2,Math.max(w,h)*.75);
  r.addColorStop(0,"rgba(0,0,0,0)"); r.addColorStop(1,"rgba(0,0,0,.45)");
  v.fillStyle=r; v.fillRect(0,0,w,h);
}

let frame = 0;
function paintCells(){
  const t = frame;
  const up = (grav+4)&7, ux = DX[up], uy = DY[up];
  const gx = DX[grav], gy = DY[grav];
  // iterate so that each cell's "up" neighbour is visited first (for depth)
  const ya = gy>0 ? 0 : H-1, yb = gy>0 ? H : -1, ysd = gy>0 ? 1 : -1;
  const xa = gx>0 ? 0 : W-1, xb = gx>0 ? W : -1, xsd = gx>0 ? 1 : -1;
  const edge = edgesOpen ? E : WALL;
  for (let y=ya; y!==yb; y+=ysd) {
    for (let x=xa; x!==xb; x+=xsd) {
      const i = y*W+x, ty = type[i], o = i<<2;
      if (ty===E){ P[o+3]=0; G[o+3]=0; depth[i]=0; continue; }
      const ux2=x+ux, uy2=y+uy;
      const j = (ux2<0||uy2<0||ux2>=W||uy2>=H) ? -1 : uy2*W+ux2;
      const above = j<0 ? edge : type[j];
      const d = (j>=0 && above===ty) ? Math.min(255, depth[j]+1) : 0;
      depth[i] = d;
      const open = above===E;
      const sh = shade[i], hs = HASH[i];
      let r=0,g=0,b=0,e=0,a=255;
      switch (ty){
        case WALL: {
          const row = (y/5)|0;
          const mortar = (y%5===0) || ((x + (row&1)*5) % 10 === 0);
          const n = (hs&15) - 8;
          if (mortar){ r=52+n; g=56+n; b=70+n; }
          else { r=92+n+(sh>>1); g=98+n+(sh>>1); b=118+n+sh; }
          if (open){ r+=40; g+=42; b+=46; }
          break;
        }
        case SAND: {
          const n = sh*3 - 22;
          r=226+n; g=194+n; b=126+n*.8;
          if (hs<10){ r-=40; g-=40; b-=30; }            // darker grains
          else if (hs>250){ r=255; g=245; b=210; }       // glints
          if (open){ r+=18; g+=18; b+=18; }
          const k=Math.min(d,30)*.9; r-=k; g-=k; b-=k;
          break;
        }
        case WATER: {
          const k = Math.min(d,48)/48;
          const s = SIN[(x*7 + y*4 + t*2)&255] * 10 + SIN[(x*3 - t*3 + y*9)&255]*6;
          r = 34 - 18*k; g = 120 - 55*k + s; b = 228 - 80*k + s*1.4;
          if (open || d===0){ r=150; g=215+s; b=255; }
          else if (d===1){ r=70; g=160+s; b=245; }
          break;
        }
        case OIL: {
          const k = Math.min(d,30)/30;
          r = 92 - 40*k; g = 56 - 28*k; b = 26 - 12*k;
          if (open || d===0){
            const s = SIN[(x*6 - t*2)&255];
            r = 190 + s*40; g = 130 + SIN[(x*6 - t*2 + 85)&255]*40; b = 70 + SIN[(x*6 - t*2 + 170)&255]*60;
          }
          r += sh>>1; g += sh>>2;
          break;
        }
        case FIRE: {
          let h = (life[i] + (sh&7)) / 34 + SIN[(t*29 + i*7)&255]*.12;
          h = h<0?0:h>1?1:h;
          if (sh&16){ r = 255; g = 190 + 65*h; b = 40 + 120*h*h; }      // sodium-yellow flame
          else { r = 200 + 55*h; g = 50 + 200*h*h; b = 10 + 150*h*h*h; }
          e = 255;
          break;
        }
        case ACID: {
          const k = Math.min(d,40)/40;
          const s = SIN[(x*6 + y*5 + t*3)&255] * 8;
          r = 150 - 60*k; g = 225 - 70*k + s; b = 40 - 20*k;
          if (open || d===0){ r=214; g=255; b=120; }
          if (((x*7 + y*13 + (t>>1)) % 47) === 0){ r=235; g=255; b=200; }   // fizz
          e = 40;
          break;
        }
        case BRINE: {
          const k = Math.min(d,48)/48;
          const s = SIN[(x*5 + y*3 + t)&255] * 6;
          r = 42 - 20*k; g = 128 - 50*k + s; b = 140 - 50*k + s;
          if (open || d===0){ r=150; g=220+s; b=210+s; }
          else if (d===1){ r=80; g=170+s; b=170+s; }
          if (hs>246){ r+=40; g+=30; b+=30; }                        // salt specks
          break;
        }
        case STEAM: {
          const n = SIN[(x*9 + y*5 + t*3)&255];
          r = 222 + n*14; g = 228 + n*14; b = 240 + n*10;
          a = 80 + Math.min(life[i],200)*.6 + n*20;                      // fades as it cools
          break;
        }
        case PLANT: {
          const k = Math.min(d,14)*4;
          r = 34 + (sh<<1) - k*.4; g = 150 + sh*4 - k; b = 52 + sh - k*.3;
          if (open){
            r += 40; g += 45; b += 10;
            if (hs<6){ r=255; g=150; b=200; }           // pink blossom
            else if (hs>250){ r=255; g=225; b=90; }    // yellow blossom
          }
          break;
        }
        case SEED: {
          r = 176 + sh*2; g = 128 + sh; b = 70;
          if (hs&1){ r-=40; g-=34; b-=24; }
          break;
        }
        case SALT: {
          const n = sh - 8;
          r = 228+n; g = 230+n; b = 238+n;
          if (((x*13 + y*7 + (t>>2)) % 71) === 0){ r=g=b=255; e=140; }
          break;
        }
        case SOIL: {
          r = 104 + (sh-8)*2; g = 70 + (sh-8); b = 44;
          if (hs>232){ r=150; g=114; b=80; }
          else if (hs<18){ r=64; g=40; b=24; }
          if (open){ r = 90 + (sh<<1); g = 128 + (sh<<1); b = 54; }           // moss on top
          else if (d<2 && above!==SOIL){ r+=10; g+=8; }
          const k=Math.min(d,30)*.8; r-=k; g-=k*.7; b-=k*.5;
          break;
        }
        case VIRUS: {
          const p = (SIN[(t*5 + (x+y)*9)&255] + 1) * .5;
          r = 170 + 80*p; g = 40 + 70*p; b = 200 + 55*p;
          e = 90 + 70*p;
          break;
        }
        case CLOUD: {
          const n = SIN[(x*5 + t)&255]*SIN[(y*23 + (t<<1) + x)&255];
          r = 210 + n*30 + (sh>>1); g = 218 + n*28 + (sh>>1); b = 245 + n*10;
          if (open){ r+=20; g+=20; b+=10; }
          e = 25;
          break;
        }
        case MAGMA: {
          const v = (SIN[(x*11 + t*2)&255] + SIN[(y*13 - t*3 + x*3)&255]) * .5;
          if (v < -0.45){ r=96; g=26; b=18; e=60; }
          else { const q=(v+1)*.5; r = 210 + 45*q; g = 50 + 160*q*q; b = 12 + 60*q*q*q; e = 120 + 135*q; }
          break;
        }
        case VAT: {
          const rim = (y%5)===0;                                      // dark steel drum with glowing acid seams
          r = rim?44:62+(sh>>1); g = rim?50:70+(sh>>1); b = rim?40:52;
          if (!rim && (x%6)===0){ const p=(SIN[(t*3 + y*11)&255]+1)*.5; r=150+50*p; g=220+35*p; b=50; e=60+50*p; }
          if (open){ r+=20; g+=24; b+=14; }
          break;
        }
        case SEEDER: {
          const leaf = (x%4===1 && y%3===1) || (x%4===3 && y%3===2);  // little sprouts on a wooden planter
          const band = (y%4)===0;
          if (leaf){ r=96+(sh<<1); g=190+(sh<<1); b=70; e=20; }
          else { r = band?84:128+(sh>>1); g = band?56:90+(sh>>2); b = band?30:48; }
          if (open){ r+=24; g+=24; b+=12; }
          break;
        }
        case SHAKER: {
          const stripe = ((x+y)>>1)&1;
          r = stripe?196:168; g = stripe?200:172; b = stripe?214:188;
          if ((x%3===0) && (y%3===0)){ r=70; g=74; b=88; }
          break;
        }
        case SPILL: {
          const band = (y%6)<1;
          r = band?70:132+(sh>>1); g = band?44:86+(sh>>2); b = band?20:40;
          break;
        }
        case TOXIN: {
          const hz = (((x+y)>>2)&1);
          const p = (SIN[(t*4 + x*3)&255] + 1) * .5;
          if (hz){ r=58; g=16; b=72; e=0; }                                // dark violet hazard stripes
          else { r = 150 + 70*p; g = 30 + 40*p; b = 180 + 60*p; e = 80 + 60*p; }   // glowing purple, like the virus it breeds
          break;
        }
      }
      P[o]=r; P[o+1]=g; P[o+2]=b; P[o+3]=a;
      if (e){ G[o]=r; G[o+1]=g; G[o+2]=b; G[o+3]=e; } else G[o+3]=0;
    }
  }
}

function render(){
  frame++;
  paintCells();
  simX.putImageData(simImg,0,0);
  glowX.putImageData(glowImg,0,0);
  const cw = cv.width, ch = cv.height;
  ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
  ctx.drawImage(bgC,0,0);
  // soft shadow of everything for depth
  shadX.clearRect(0,0,W,H); shadX.filter="blur(1.2px) brightness(0)"; shadX.drawImage(simC,0,0);
  ctx.imageSmoothingEnabled = true;
  ctx.globalAlpha = .45;
  ctx.drawImage(shadC, cw/W*0.7, ch/H*1.1, cw, ch);
  ctx.globalAlpha = 1;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(simC,0,0,cw,ch);
  // glow: a tight bloom and a wide halo, added on top
  blurX.clearRect(0,0,W,H); blurX.filter="blur(1.5px)"; blurX.drawImage(glowC,0,0);
  haloX.clearRect(0,0,haloC.width,haloC.height); haloX.filter="blur(3px)"; haloX.drawImage(glowC,0,0,haloC.width,haloC.height);
  ctx.imageSmoothingEnabled = true;
  ctx.globalCompositeOperation = "lighter";
  ctx.globalAlpha = .75; ctx.drawImage(blurC,0,0,cw,ch);
  ctx.globalAlpha = .6;  ctx.drawImage(haloC,0,0,cw,ch);
  ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
  ctx.drawImage(vigC,0,0);
  // shape preview while dragging a line or box
  if (preview){
    const s = cw / W;
    ctx.strokeStyle="rgba(255,255,255,.85)"; ctx.lineWidth=Math.max(1,s*.5); ctx.setLineDash([s*2,s*2]);
    const {a,b}=preview; ctx.beginPath();
    if (shape==="line"){ ctx.moveTo((a.x+.5)*s,(a.y+.5)*s); ctx.lineTo((b.x+.5)*s,(b.y+.5)*s); }
    else ctx.rect(Math.min(a.x,b.x)*s, Math.min(a.y,b.y)*s, (Math.abs(a.x-b.x)+1)*s, (Math.abs(a.y-b.y)+1)*s);
    ctx.stroke(); ctx.setLineDash([]);
  }
}

// The grid covers the whole screen. If the window changes shape a lot later
// (split screen, a foldable opening), show the whole grid letterboxed instead.
function fit(){
  const vw = innerWidth, vh = innerHeight;
  if (!vw || !vh) return;
  const dpr = Math.min(window.devicePixelRatio||1, 3);
  const cover = Math.max(vw/W, vh/H), contain = Math.min(vw/W, vh/H);
  const k = cover/contain < 1.15 ? cover : contain;          // CSS px per cell
  const px = Math.max(1, Math.round(k*dpr));                  // canvas px per cell
  const pw = W*px, ph = H*px;
  if (cv.width!==pw || cv.height!==ph){ cv.width=pw; cv.height=ph; buildBackdrop(pw,ph); }
  const cssW = W*k, cssH = H*k;
  cv.style.width=cssW+"px"; cv.style.height=cssH+"px";
  cv.style.left=((vw-cssW)/2)+"px"; cv.style.top=((vh-cssH)/2)+"px";
}

const BUB = 62, EDGE = 14;

// Open the menu beside its bubble: on the bubble's side, above or below it (wherever there's more room).
function placeMenu(k){
  const b=menus[k][0].getBoundingClientRect(), m=menus[k][1], st=m.style;
  const vw=innerWidth, vh=innerHeight;
  if (uiRot){                                   // phone sideways: open in the middle, turned upright, using the long side
    const L = Math.min(vh - 40, k==="el" ? 760 : 900);
    st.width=L+"px"; st.maxHeight=(vw - 40)+"px";
    st.left=(vw/2)+"px"; st.top=(vh/2)+"px"; st.right="auto"; st.bottom="auto";
    st.setProperty("--tf", `translate(-50%,-50%) rotate(${uiRot}deg)`);
    st.setProperty("--ox","50%"); st.setProperty("--oy","50%");
    return;
  }
  st.width=""; st.removeProperty("--tf");
  const w=m.offsetWidth;
  const left = bubbles[k].side==="l" ? Math.max(INS.l+10, b.left-4) : Math.min(vw-INS.r-10, b.right+4) - w;
  st.left=Math.max(8, Math.min(vw-w-8, left))+"px"; st.right="auto";

  else { st.bottom="auto"; st.top=(b.bottom + 10)+"px"; st.maxHeight=(below-10)+"px"; st.setProperty("--oy","0%"); }

for (const k in menus){

  b.addEventListener("pointerdown",e=>{
    pid=e.pointerId; b.setPointerCapture(pid); sx=e.clientX; sy=e.clientY;
    const r=b.getBoundingClientRect(); ox=r.left; oy=r.top; dragging=false;
    b.classList.remove("drift"); b.classList.add("held");
  });
  b.addEventListener("pointermove",e=>{
    if (e.pointerId!==pid) return;

    if (dragging){

    }

  const release=(e,tap)=>{
    if (e.pointerId!==pid) return;
    pid=null; b.classList.remove("held","dragging");

      const r=b.getBoundingClientRect();
      let side = r.left + BUB/2 < innerWidth/2 ? "l" : "r", top = clampY(r.top);

document.querySelectorAll(".menu input[type=range]").forEach(inp=>{
  const host=inp.parentElement; let pid=null;
  const setFrom=e=>{
    const r=inp.getBoundingClientRect();
    let t = uiRot===90 ? (e.clientY-r.top)/r.height : (r.bottom-e.clientY)/r.height;   // min end is at the top when turned +90
    t=Math.max(0,Math.min(1,t));
    const min=+inp.min||0, max=+inp.max||100, step=+inp.step||1;
    const v=Math.round((min+t*(max-min))/step)*step;
    if (+inp.value!==v){ inp.value=v; inp.dispatchEvent(new Event("input",{bubbles:true})); }
  };
  host.addEventListener("pointerdown",e=>{
    if (!uiRot) return;
    const r=inp.getBoundingClientRect();
    if (e.clientX<r.left-16 || e.clientX>r.right+16 || e.clientY<r.top-10 || e.clientY>r.bottom+10) return;
    pid=e.pointerId; try{ host.setPointerCapture(pid); }catch(err){} e.preventDefault(); setFrom(e);
  });
  host.addEventListener("pointermove",e=>{ if (e.pointerId===pid) setFrom(e); });
  const end=e=>{ if (e.pointerId===pid) pid=null; };
  host.addEventListener("pointerup",end); host.addEventListener("pointercancel",end);
});

  if (Math.hypot(gx,gy) < 5) return;                             // lying flat: keep the current layout

});

let tiltOn=false;

function onMotion(ev){
  const a = ev.accelerationIncludingGravity; if (!a || a.x==null) return;
  const gxs = -a.x, gys = a.y;
  const ang = ((screen.orientation && screen.orientation.angle) || 0) * Math.PI/180;
  const sx = gxs*Math.cos(ang) + gys*Math.sin(ang);
  const sy = -gxs*Math.sin(ang) + gys*Math.cos(ang);
  const m = Math.hypot(sx,sy); if (m < 3.5) return;            // phone lying flat: keep current gravity
  const nx=sx/m, ny=sy/m;
  const dot = k => (DX[k]*nx + DY[k]*ny) / Math.hypot(DX[k],DY[k]);
  let best=grav, bd=dot(grav)+0.08;                             // hysteresis
  for (let k=0;k<8;k++){ const v=dot(k); if (v>bd){ bd=v; best=k; } }
  if (best!==grav) setGrav(best);
}
$("tiltPhone").onclick=async()=>{
  if (!tiltOn && typeof DeviceMotionEvent.requestPermission==="function"){
    try{ if (await DeviceMotionEvent.requestPermission()!=="granted") return; }catch(e){ return; }
  }
  tiltOn=!tiltOn;
  $("tiltPhone").textContent = "📱 Tilt phone: " + (tiltOn?"on":"off");
  $("tiltPhone").classList.toggle("on",tiltOn);
  if (tiltOn) addEventListener("devicemotion",onMotion); else removeEventListener("devicemotion",onMotion);
  toast(tiltOn ? "Tilt your phone to pour the world around" : "Tilt control off");
};

// --- save / load (sandbox) ---
function b64(u8){ let s=""; for(let i=0;i<u8.length;i+=8192) s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192)); return btoa(s); }
function unb64(s){ const b=atob(s), u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
function worldJSON(arr, g){ return JSON.stringify({w:W,h:H,t:b64(arr),g,r:$("rule").value}); }
function applyWorld(d){
  const t=unb64(d.t), sw=d.w||W, sh=d.h||Math.floor(t.length/sw);
  clearWorld();
  // a world saved on a different screen shape keeps its bottom-left corner
  for(let y=0;y<sh;y++) for(let x=0;x<sw;x++){
    const v=t[y*sw+x]; if(!v || v>=INFO.length) continue;
    const ny=y+(H-sh); if (x<W && ny>=0 && ny<H) set(ny*W+x,v);
  }
  setGrav(d.g||0); if (d.r){ $("rule").value=d.r; setRule(d.r); }
}
$("save").onclick=()=>{
  try{ localStorage.setItem("sandfall.save", worldJSON(type,grav)); toast("World saved"); }
  catch(e){ toast("Couldn't save"); }
};
$("load").onclick=()=>{
  try{
    const d=JSON.parse(localStorage.getItem("sandfall.save")||"null");
    if(!d){ toast("Nothing saved yet"); return; }
    pushUndo(); applyWorld(d); toast("World loaded"); closeMenus();
  }catch(e){ toast("Couldn't load"); }
};
// The sandbox is saved whenever the app is left (and every 20 s), and restored on the next start.
// During a challenge, the sandbox as it was before the challenge is what gets saved.
window.autosave = ()=>{
  try{
    const arr = challenge ? sandboxSnapshot : type;
    if (arr) localStorage.setItem("sandfall.autosave", worldJSON(arr, challenge ? 0 : grav));
  }catch(e){}
};
function restoreAutosave(){
  try{ const d=JSON.parse(localStorage.getItem("sandfall.autosave")||"null"); if (d && d.t){ applyWorld(d); return true; } }catch(e){}
  return false;
}
document.addEventListener("visibilitychange",()=>{ if (document.hidden) autosave(); });
addEventListener("pagehide",()=>autosave());
setInterval(()=>autosave(), 20000);

// --- undo: snapshots taken just before each stroke, Clear and Load (last 20) ---
const UNDO_MAX = 20;
let undoStack = [];
function pushUndo(){
  undoStack.push({ t:type.slice(), s:shade.slice(), l:life.slice(), g:grav,
                   b: challenge ? Object.assign({}, budget) : null, rt: runTicks });
  if (undoStack.length > UNDO_MAX) undoStack.shift();
  $("undo").disabled = false;
}
function undo(){
  const u = undoStack.pop(); if (!u) return;
  type.set(u.t); shade.set(u.s); life.set(u.l); setGrav(u.g);
  if (challenge && u.b){ budget = u.b; runTicks = u.rt; hold = 0; finished = false; $("overlay").style.display="none"; updateGoal(); }
  refreshPalette();
  $("undo").disabled = undoStack.length===0;
  toast(undoStack.length ? `Undone (${undoStack.length} more)` : "Undone");
}
function resetUndo(){ undoStack = []; $("undo").disabled = true; }
$("undo").onclick=()=>undo();

// --- painting ---
function gridPos(e){
  const r=cv.getBoundingClientRect();
  return { x: Math.floor((e.clientX-r.left)/r.width*W), y: Math.floor((e.clientY-r.top)/r.height*H) };
}
function paintCell(x,y,t,sparse){
  const i=idx(x,y); if(i<0 || lock[i]) return;
  if (type[i]===t) return;
  if (t!==E && sparse && GRAIN[t] && rnd()<.35) return;
  if (challenge && t!==E){ if(!(budget[t]>0)) return; budget[t]--; }
  if (t===E){ type[i]=E; life[i]=0; } else set(i,t);
}
function disk(cx,cy,t){
  const r=brush, r2=(r+.5)*(r+.5);
  for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++) if(dx*dx+dy*dy<=r2) paintCell(cx+dx,cy+dy,t,true);
}
function lineCells(a,b,fn){
  let x=a.x,y=a.y; const dx=Math.abs(b.x-x), dy=-Math.abs(b.y-y), sx=x<b.x?1:-1, sy=y<b.y?1:-1; let err=dx+dy;
  for(;;){ fn(x,y); if(x===b.x&&y===b.y) break; const e2=2*err; if(e2>=dy){err+=dy;x+=sx;} if(e2<=dx){err+=dx;y+=sy;} }
}
function commitShape(a,b,t){
  if (shape==="line") lineCells(a,b,(x,y)=>disk(x,y,t));
  else {
    const x0=Math.max(0,Math.min(a.x,b.x)),x1=Math.min(W-1,Math.max(a.x,b.x)),y0=Math.max(0,Math.min(a.y,b.y)),y1=Math.min(H-1,Math.max(a.y,b.y));
    const th=Math.max(1,brush>>1);
    for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++)
      if (shape==="frect" || x-x0<th||x1-x<th||y-y0<th||y1-y<th) paintCell(x,y,t,false);
  }
  refreshPalette();
}
let swallow=false;   // a touch that only closed a menu doesn't paint
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("pointerdown",e=>{
  if (!e.isPrimary) return;
  if (closeMenus()){ swallow=true; return; }
  swallow=false;
  try{ cv.setPointerCapture(e.pointerId); }catch(err){}
  drawing=true; pushUndo();
  const p=gridPos(e); last=p;
  if (shape==="brush"){ disk(p.x,p.y,tool); refreshPalette(); }
  else preview={a:p,b:p};
});
cv.addEventListener("pointermove",e=>{
  if (!e.isPrimary || !drawing) return;
  const p=gridPos(e);
  if (shape==="brush"){ lineCells(last,p,(x,y)=>disk(x,y,tool)); last=p; refreshPalette(); }
  else if (preview) preview.b=p;
});
function endDraw(e){
  if (e && !e.isPrimary) return;
  if (drawing && preview) commitShape(preview.a,preview.b,tool);
  drawing=false; preview=null; swallow=false;
}
cv.addEventListener("pointerup",endDraw);
cv.addEventListener("pointercancel",e=>{ if(!e.isPrimary) return; drawing=false; preview=null; });

// =====================================================================
//  Challenges  (laid out in fractions of the screen so they fit any phone)
// =====================================================================
const X = f => Math.round(f*W), Y = f => Math.round(f*H);
function box(x0,y0,x1,y1,t){ for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){ const i=idx(x,y); if(i>=0) set(i,t); } }
function countIn(t,x0,y0,x1,y1){ let n=0; for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++) if(type[y*W+x]===t) n++; return n; }
function countAll(t){ let n=0; for(let i=0;i<N;i++) if(type[i]===t) n++; return n; }
const SEC = 60;
const CHALLENGES = [
  {
    name:"1 · Into the Basin",
    desc:"The cloud rains in the wrong place. Build walls to steer the water into the basin.",
    tools:{[WALL]:650,[E]:Infinity}, limit:45*SEC,
    setup(){
      box(X(.06),Y(.3),X(.32),Y(.3)+2,CLOUD);
      this.bx0=X(.64)+3; this.bx1=W-4; this.by0=Y(.62);
      box(X(.64),this.by0,X(.64)+2,H-1,WALL); box(W-3,this.by0,W-1,H-1,WALL);
    },
    measure(){ const v=countIn(WATER,this.bx0,this.by0,this.bx1,H-1); return {v, goal:1500, text:`💧 <b>${v}</b> / 1500`}; },
    ok:m=>m.v>=m.goal,
  },
  {
    name:"2 · Controlled Burn",
    desc:"Clear all five groves with only 2 sparks. Stone pillars stop the flames — oil might help them spread.",
    tools:{[OIL]:1500,[FIRE]:2}, limit:0,
    setup(){
      const top=H-46;
      box(0,top-24,3,H-1,WALL); box(W-4,top-24,W-1,H-1,WALL);
      const gw=Math.floor((W-8-4*6)/5);
      let x=4;
      for(let g=0;g<5;g++){ box(x,top,x+gw-1,H-1,PLANT); x+=gw; if(g<4){ box(x,top,x+5,H-1,WALL); x+=6; } }
      if (x<W-4) box(x,top,W-5,H-1,WALL);
      this.start=countAll(PLANT); this.goal=Math.round(this.start*.03);
    },
    measure(){ const v=countAll(PLANT); return {v, goal:this.goal, start:this.start, text:`🌿 <b>${v}</b> left (≤ ${this.goal})`}; },
    ok:m=>m.v<=m.goal,
  },
  {
    name:"3 · Quarantine",
    desc:"Wipe out every last virus cell with salt. Tilting the world may help.",
    tools:{[SALT]:1200}, limit:0,
    setup(){
      const L=X(.12), R=X(.88), bot=H-10;
      box(L,Y(.22),L+2,bot,WALL); box(R-2,Y(.22),R,bot,WALL); box(L,bot-2,R,bot,WALL);
      for(let y=bot-112;y<bot-12;y++) for(let x=L+12;x<R-12;x++) if(rnd()<.33) set(y*W+x,VIRUS);
      for(let n=0;n<12;n++) lifeStep();
    },
    measure(){ const v=countAll(VIRUS); return {v, goal:0, text:`🦠 <b>${v}</b> left`}; },
    ok:m=>m.v===0,
  },
  {
    name:"4 · Green Thumb",
    desc:"Grow 2500 plants from the seeds. The rain is on the wrong side of a magma vent — and any plant that touches it goes up in flames.",
    tools:{[WALL]:650,[E]:Infinity}, limit:75*SEC,
    setup(){
      box(0,H-10,W-1,H-1,SOIL); box(X(.06),Y(.3),X(.3),Y(.3)+2,CLOUD); box(X(.4),Y(.58),X(.4)+8,H-11,MAGMA);
      for(let x=X(.6);x<W-4;x+=2) set((H-11)*W+x,SEED);
    },
    measure(){ const v=countAll(PLANT); return {v, goal:2500, text:`🌱 <b>${v}</b> / 2500`}; },
    ok:m=>m.v>=m.goal,
  },
];
let solved = {};
try{ solved = JSON.parse(localStorage.getItem("sandfall.solved")||"{}"); }catch(e){}
const modeSel=$("mode");
function buildModeMenu(){
  modeSel.innerHTML=`<option value="-1">🏖 Sandbox</option>`+CHALLENGES.map((c,i)=>`<option value="${i}">${solved[i]?"⭐":"🧩"} ${c.name}</option>`).join("");
  modeSel.value = challenge ? CHALLENGES.indexOf(challenge) : -1;
}
buildModeMenu();
modeSel.onchange=()=>{ startMode(+modeSel.value); closeMenus(); };

let sandboxSnapshot=null;
function startMode(n){
  setRunning(false); resetUndo();
  $("overlay").style.display="none";
  if (n<0){
    challenge=null; clearWorld();
    if (sandboxSnapshot){ for(let i=0;i<N;i++) if(sandboxSnapshot[i]) set(i,sandboxSnapshot[i]); }
    setRule($("rule").value);
    $("goal").style.display="none";
    $("sandboxOnly").classList.remove("hidden"); $("challengeOnly").classList.add("hidden");
    applyEdges(); refreshPalette(); selectTool(SAND,true); modeSel.value=-1;
    return;
  }
  if (!challenge) sandboxSnapshot = type.slice();
  challenge = CHALLENGES[n];
  applyEdges();
  setRule("B3/S23"); setGrav(0);
  clearWorld(); challenge.setup();
  for (let i=0;i<N;i++) lock[i] = type[i]!==E ? 1 : 0;
  budget = {...challenge.tools};
  runTicks=0; hold=0; finished=false;
  $("goal").style.display="block"; $("goal").classList.remove("min");
  $("sandboxOnly").classList.add("hidden"); $("challengeOnly").classList.remove("hidden");
  $("goalTitle").textContent=challenge.name;
  $("goalDesc").textContent=challenge.desc+" Press ▶ when ready.";
  selectTool(+Object.keys(budget).find(k=>+k!==E), true);
  updateGoal(); placeGoal();
  modeSel.value=n;
}
$("reset").onclick=()=>{ startMode(CHALLENGES.indexOf(challenge)); closeMenus(); };
$("goal").onclick=()=>{ $("goal").classList.toggle("min"); placeGoal(); };
$("ovRetry").onclick=()=>startMode(CHALLENGES.indexOf(challenge));
$("ovNext").onclick=()=>{ const n=CHALLENGES.indexOf(challenge)+1; startMode(n<CHALLENGES.length?n:-1); };

function updateGoal(){
  if (!challenge) return;
  const m=challenge.measure();
  $("goalText").innerHTML=m.text;
  let p;
  if (m.start!==undefined) p=(m.start-m.v)/(m.start-m.goal);
  else if (m.goal===0) p = m.v===0 ? 1 : 0;
  else p=m.v/m.goal;
  document.querySelector("#bar div").style.width=Math.max(0,Math.min(100,p*100))+"%";
  $("timer").textContent = challenge.limit ? `⏱ ${Math.max(0,Math.ceil((challenge.limit-runTicks)/SEC))}s` : `⏱ ${Math.floor(runTicks/SEC)}s`;
  return m;
}
function checkChallenge(){
  if (!challenge || finished) return;
  const m=updateGoal();
  if (challenge.ok(m)) hold+=10; else hold=0;
  if (hold>=60){
    finished=true; setRunning(false);
    const n=CHALLENGES.indexOf(challenge);
    solved[n]=1; try{ localStorage.setItem("sandfall.solved",JSON.stringify(solved)); }catch(e){}
    buildModeMenu();
    showOverlay("Solved! ⭐", `Done in ${Math.floor(runTicks/SEC)} seconds.`, true);
  } else if (challenge.limit && runTicks>=challenge.limit){
    finished=true; setRunning(false);
    showOverlay("Out of time ⏱", "Tweak your build and try again.", false);
  }
}
function showOverlay(title,text,won){
  closeMenus();
  $("ovTitle").textContent=title; $("ovText").textContent=text;
  $("ovNext").style.display = won ? "" : "none";
  $("overlay").style.display="flex";
}

// =====================================================================
//  Main loop
// =====================================================================
function tick(){
  stepWorld();
  if (challenge && !finished){ runTicks++; if (runTicks%10===0) checkChallenge(); }
}
let lastT = performance.now();
function loop(now){
  const dt = Math.min(100, now - lastT); lastT = now;
  if (running){ acc += speed * dt / (1000/60); let n=0; while(acc>=1 && n<8){ tick(); acc--; n++; } if (acc>4) acc=0; }
  render();
  requestAnimationFrame(loop);
}

function starter(){
  const g=H-8;
  box(0,g,W-1,H-1,SOIL);
  for (let x=0;x<W;x++){ const h=Math.round(4+3*Math.sin(x/19)+2*Math.sin(x/7)); for(let y=g-h;y<g;y++) set(y*W+x,SOIL); }
  box(X(.08),Y(.12),X(.36),Y(.12)+2,CLOUD);
  box(X(.64),Y(.12),X(.82),Y(.12)+1,SHAKER);
  box(X(.42),g-34,X(.6),g-8,PLANT);
  box(X(.86),g-20,X(.93),g-8,MAGMA);
  const cx=X(.2), hw=X(.14);
  for(let x=cx-hw;x<cx+hw;x++) for(let y=g-30;y<g-4;y++){ const c=Math.abs(x-cx)/hw; if (y > g-30 + c*c*26 && rnd()<.85) set(y*W+x,SAND); }
  const cy=Y(.5), c0=X(.58), c1=X(.86);
  box(c0,cy,c1,cy+2,WALL); box(c0,cy-16,c0+2,cy-1,WALL); box(c1-2,cy-16,c1,cy-1,WALL);
  for(let x=c0+3;x<c1-2;x++) for(let y=cy-9;y<cy;y++) if(rnd()<.9) set(y*W+x,OIL);
}
setGrav(0);
if (!restoreAutosave()) starter();
selectTool(SAND,true); refreshPalette(); setRunning(false);
fit();
requestAnimationFrame(()=>{ fit(); setRunning(true); requestAnimationFrame(loop); });
</script>
