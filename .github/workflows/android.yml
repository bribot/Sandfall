name: Build Android APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # lets the workflow publish releases

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Prepare signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sandfall-release.p12"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/sandfall-release.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 is not set: signed with a throwaway debug key and no release published"
          fi

      - name: Build APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Sandfall.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Sandfall-apk
          path: Sandfall.apk

      # Every signed build of main becomes a release, so
      # https://github.com/bribot/Sandfall/releases/latest/download/Sandfall.apk is always the newest.
      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.SIGNING_KEYSTORE_PATH != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v2.0.${GITHUB_RUN_NUMBER}" Sandfall.apk \
            --target "${GITHUB_SHA}" \
            --title "Sandfall 2.0.${GITHUB_RUN_NUMBER}" \
            --notes "Built from main @ ${GITHUB_SHA::7}. Download Sandfall.apk below and open it on your phone to install or update." \
            --latest
